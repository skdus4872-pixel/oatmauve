<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네이버페이 결제 안내</title>
<style>
  body{margin:0;padding:0;background:#FFF4E8;color:#2A2422;font-family:Pretendard,Arial,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:64px 24px 80px;}
  .card{background:#fff;border:1px solid #E7D9D4;border-radius:16px;padding:36px;box-shadow:0 12px 30px rgba(0,0,0,.05);}
  h1{margin:0 0 16px;font-size:28px;}
  p{line-height:1.8;color:#5A3540;margin:0 0 12px;}
  .box{margin-top:24px;padding:18px 20px;border-radius:12px;background:#F4D9DC;}
  .btn{display:inline-block;margin-top:18px;padding:12px 18px;border-radius:999px;background:#2A2422;color:#fff;text-decoration:none;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>네이버페이 결제 안내</h1>
      <p>오트모브는 네이버페이 연동을 위한 결제 안내 페이지를 추가해 두었습니다.</p>
      <p>실제 결제 연동을 완료하려면 카페24 관리자에서 네이버페이 결제수단을 활성화하고, 주문/결제 모듈에 네이버페이 설정을 적용해야 합니다.</p>
      <div class="box">
        <strong>적용 포인트</strong>
        <p>관리자 &gt; 쇼핑몰 관리 &gt; 결제/배송 &gt; 네이버페이 설정에서 연동 후, 주문서 페이지의 결제수단 목록에 네이버페이가 노출됩니다.</p>
      </div>
      <a class="btn" href="login.html">로그인 페이지로 돌아가기</a>
    </div>
  </div>
</body>
</html>
