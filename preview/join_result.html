<!doctype html>
<!--
  정적 미리보기 빌드 — 회원가입 3단계(가입완료).
  이름은 join.html 이 sessionStorage 에 넣어둔 값을 한 번 읽고 바로 지웁니다.
  실제 배포본은 카페24가 생성하는 /member/join_result.html 을 그대로 씁니다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAT MAUVE | 회원가입 완료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#FFF4E8;--blush:#F4D9DC;--rose:#E3AEB8;--mauve:#7A4B56;--mauve-deep:#5A3540;--ink:#2A2422;--taupe:#C9B8AE;--line:#E7D9D4;--white:#FFFFFF;--font-body:"Pretendard","Noto Sans KR",sans-serif;}
body#auth{margin:0;padding:0;font-family:var(--font-body);color:var(--ink);background:var(--ivory);-webkit-font-smoothing:antialiased;min-height:100vh;}
body#auth *{box-sizing:border-box;}
body#auth a{color:inherit;text-decoration:none;}
body#auth img{border:0;}
.auth-topbar{padding:22px 32px;text-align:center;border-bottom:1px solid var(--line);}
.auth-topbar img{height:34px;width:auto;}

.auth-single{max-width:760px;margin:0 auto;padding:56px 24px 130px;}
.join-steps{display:flex;gap:0;list-style:none;margin:0 0 52px;padding:0;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--white);}
.join-steps li{flex:1;text-align:center;padding:13px 6px;font-size:12px;letter-spacing:.04em;color:var(--taupe);border-left:1px solid var(--line);}
.join-steps li:first-child{border-left:none;}
.join-steps li.on{background:var(--ink);color:var(--ivory);font-weight:600;}
.join-steps li .num{font-family:"Fraunces",serif;font-style:italic;margin-right:6px;}

.result-box{text-align:center;padding:10px 0 0;}
.result-mark{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--white);display:flex;align-items:center;justify-content:center;margin:0 auto 26px;}
.result-mark svg{width:26px;height:26px;fill:none;stroke:var(--mauve);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.result-box h2{font-family:"Fraunces",serif;font-style:italic;font-weight:500;font-size:32px;line-height:1.25;margin:0 0 16px;color:var(--ink);}
.result-box .lead{font-size:14px;line-height:1.85;color:var(--taupe);margin:0 0 8px;}
.result-box .lead strong{color:var(--ink);font-weight:600;}
.coupon{border:1px solid var(--line);background:var(--white);border-radius:2px;padding:22px 20px;margin:38px 0 0;}
.coupon .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);margin:0 0 8px;}
.coupon .amount{font-family:"Fraunces",serif;font-style:italic;font-weight:600;font-size:26px;color:var(--mauve);margin:0 0 6px;}
.coupon .desc{font-size:12.5px;color:var(--taupe);margin:0;}
.btn-row{display:flex;gap:10px;margin:44px 0 0;}
.btn-row a{flex:1;padding:15px 0;text-align:center;font-size:13.5px;font-weight:600;letter-spacing:.02em;border-radius:2px;border:1px solid var(--line);transition:background .2s ease,border-color .2s ease,color .2s ease;}
.btn-row .primary{background:var(--ink);border-color:var(--ink);}
.btn-row .primary:hover{background:var(--mauve-deep);border-color:var(--mauve-deep);}
.btn-row .ghost:hover{border-color:var(--mauve);}
body#auth .btn-row .primary{color:var(--ivory);}
body#auth .btn-row .ghost{color:var(--ink);}
.mock-note{border:1px dashed var(--line);background:var(--white);padding:14px 16px;border-radius:2px;font-size:12px;line-height:1.7;color:var(--taupe);margin:34px 0 0;text-align:left;}
@media (max-width:640px){
  .auth-single{padding:40px 18px 100px;}
  .join-steps li{font-size:11px;padding:11px 4px;}
  .result-box h2{font-size:26px;}
  .btn-row{flex-direction:column;}
}
</style>
</head>
<body id="auth">

<div class="auth-topbar">
  <a href="index.html"><img src="https://ecimg.cafe24img.com/pg3204b51964264006/oatmauve/logo.png" alt="OAT MAUVE"></a>
</div>

<div class="auth-single">
  <ol class="join-steps">
    <li><span class="num">01</span>약관동의</li>
    <li><span class="num">02</span>정보입력</li>
    <li class="on"><span class="num">03</span>가입완료</li>
  </ol>

  <div class="result-box">
    <div class="result-mark">
      <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 7"/></svg>
    </div>

    <h2>Welcome to OAT MAUVE</h2>
    <p class="lead" id="greeting">회원가입이 완료되었습니다.</p>
    <p class="lead">이제 로그인하고 회원 전용 혜택을 이용하실 수 있습니다.</p>

    <div class="coupon">
      <p class="label">Welcome Gift</p>
      <p class="amount">5% OFF</p>
      <p class="desc">신규 가입 축하 쿠폰이 발급되었습니다. 마이페이지 &gt; 쿠폰에서 확인하세요.</p>
    </div>

    <div class="btn-row">
      <a href="login.html" class="primary">로그인하기</a>
      <a href="index.html" class="ghost">쇼핑 계속하기</a>
    </div>

    <p class="mock-note">
      미리보기용 목업 화면입니다. 실제로 계정이 만들어지거나 쿠폰이 발급되지는 않으며,
      입력하신 값은 어디에도 저장되지 않았습니다.
    </p>
  </div>
</div>

<script>
(function(){
  var name = null;
  try{
    name = sessionStorage.getItem('otmove_join_name');
    sessionStorage.removeItem('otmove_join_name');
  }catch(e){}

  if(name){
    var el = document.getElementById('greeting');
    el.textContent = '';
    var strong = document.createElement('strong');
    strong.textContent = name + '님';
    el.appendChild(strong);
    el.appendChild(document.createTextNode(', 회원가입이 완료되었습니다.'));
  }
})();
</script>

</body>
</html>
